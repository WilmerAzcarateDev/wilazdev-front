<form class="login-container">
  <p-iftaLabel class="login-ifta">
    <input class="login-field" pInputText type="email" name="email" id="email">
    <label for="email">e-mail</label>
  </p-iftaLabel>
  <p-iftaLabel class="login-ifta">
    <input class="login-field" pInputText type="password" id="password">
    <label for="password">password</label>
  </p-iftaLabel>
  <button pButton class="login-button" type="submit">
    Login
  </button>
</form>
