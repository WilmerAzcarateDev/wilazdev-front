<div class="flex flex-col items-center text-center gap-4 py-2">
  <div class="flex items-center justify-center w-12 h-12 rounded-full bg-red-500/10 text-red-500">
    <i class="pi pi-shield text-2xl"></i>
  </div>

  <div class="flex flex-col gap-1">
    <h2 class="text-lg font-semibold">403 — Acceso Restringido</h2>
    <p class="text-sm opacity-80">
      Tu cuenta
      @if (userEmail()) {
        <span class="font-medium">({{ userEmail() }})</span>
      }
      no cuenta con permisos de administrador para acceder a esta sección.
    </p>
  </div>

  <button
    pButton
    type="button"
    icon="pi pi-sign-out"
    label="Cambiar de cuenta"
    class="w-full"
    (click)="switchAccount()"
  ></button>
</div>
